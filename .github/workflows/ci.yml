name: Build and test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test ParallelYou.sln --configuration Release
      - run: dotnet publish ParallelYou.Host/ParallelYou.Host.csproj --configuration Release --output .output/host
      - run: docker build --tag parallel-you:ci .
